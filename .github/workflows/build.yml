name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device"
        required: true
        default: gta4xl
        type: choice
        options: [gta4xl, a51, m21, m31, m31s]
      manifest_branch:
        description: "TWRP minimal manifest branch"
        required: true
        default: twrp-12.1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      DEVICE: ${{ inputs.device }}
      BUILD_DIR: /home/runner/twrp
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 \
            lzop lz4 liblzma-dev libssl-dev bc rsync ccache cpio
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

      - name: Sync TWRP minimal manifest
        run: |
          mkdir -p "$BUILD_DIR" && cd "$BUILD_DIR"
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b "${{ inputs.manifest_branch }}"
          ~/bin/repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Add device tree
        run: |
          mkdir -p "$BUILD_DIR/device/samsung/universal9611"
          rsync -a --exclude .git --exclude .github "$GITHUB_WORKSPACE"/ "$BUILD_DIR/device/samsung/universal9611/"

      - name: Build recovery
        run: |
          cd "$BUILD_DIR"
          export LC_ALL=C ALLOW_MISSING_DEPENDENCIES=true
          set +u
          source build/envsetup.sh
          lunch twrp_${DEVICE}-eng
          mka -j"$(nproc)" recoveryimage

      - name: Package (Odin tar.md5)
        run: |
          OUT="$BUILD_DIR/out/target/product/$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/artifacts" && cd "$GITHUB_WORKSPACE/artifacts"
          cp "$OUT/recovery.img" .
          tar -H ustar -c recovery.img > "TWRP_${DEVICE}.tar"
          md5sum -t "TWRP_${DEVICE}.tar" >> "TWRP_${DEVICE}.tar"
          mv "TWRP_${DEVICE}.tar" "TWRP_${DEVICE}.tar.md5"
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_${{ inputs.device }}
          path: artifacts/*
